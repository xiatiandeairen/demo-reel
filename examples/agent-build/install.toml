# Scene 5: installing agb with cargo, into a throwaway CARGO_HOME (setup-install.sh); the recording fails
# if your own agb (in your CARGO_HOME) changed (teardown-install.sh). The compile in the middle is squeezed out.
title = "agent-build"
kind = "terminal"
max_seconds = 45
outro = true
url = "github.com/xiatiandeairen/agent-build"

[voice]
voice = "am_michael"

[terminal]
workdir = "/tmp/agb-demo-install"
setup = "setup-install.sh"
teardown = "teardown-install.sh"
init = "source $REEL_WORK/env; cd $REEL_WORK"
font_size = 52
open_hold = 0.6

[[step]]
type = "cargo install --git https://github.com/xiatiandeairen/agent-build --locked agent-build"
wait = "Installed package"
timeout = 900
squeeze = true  # cut the middle of the compile, keep its start and end
focus = "full"
say = "Install it with Cargo."
hold = 0.5

[[step]]
focus = "full"
say = "Then put agb in front of xcodebuild."
hold = 1.0
