# Scene 2: without agb. "app" was built once with plain xcodebuild (setup-xcode.sh); a new worktree of
# the same project still builds from zero. -derivedDataPath gives this worktree its own fresh folder, as
# Xcode's default would, but under the demo directory: the default one is in ~/Library and its path
# (with your user name) fills the output. The output goes to ../log rather than the screen: while the
# machine compiles, VHS stops redrawing under xcodebuild's streaming output (2026-11-23); wc -l then
# shows how much there was. The timer bar shares its scale with scene 3.
title = "agb without"
kind = "terminal"
max_seconds = 45
timer_scale = 5

[voice]
voice = "am_michael"

[terminal]
workdir = "/tmp/agb-demo-without"
setup = "setup-xcode.sh"
teardown = "teardown.sh"
# xcodebuild given a terminal as stdin finishes the build, then does not exit (Xcode 27.2, 2026-11-23);
# this shell function only gives it /dev/null as stdin. What it builds, prints and how long it takes
# are unchanged; agb already runs xcodebuild that way.
init = "source $REEL_WORK/env; cd $REEL_WORK/app; xcodebuild() { command xcodebuild \"$@\" < /dev/null; }"
font_size = 52
open_hold = 0.6
keep_files = ["log"]  # read by the results card as {files:without-agb.toml}/log

[[step]]
type = "cd ../app-feature"
focus = "full"
say = "This app was built once already."
hold = 0.3

[[step]]
type = "xcodebuild build -scheme App -destination 'generic/platform=iOS Simulator' -derivedDataPath ../dd > ../log 2>&1"
wait = '(?m)^\$ *$'  # back at an empty prompt: the build has finished
timeout = 180
timer = "xcodebuild"
focus = "full"
say = "A new worktree still starts from zero."
hold = 0.5

[[step]]
type = "wc -l ../log"
wait = '\d+ \.\./log'
focus = "full"
say = "Hundreds of lines of log, every time."
hold = 1.5
