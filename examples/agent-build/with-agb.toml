# Scene 3: with agb. "app" was built once with agb (setup-agb.sh), so its slot is warm; a new worktree
# builds incrementally in that slot. The timer bar shares its scale with scene 2.
title = "agb with"
kind = "terminal"
max_seconds = 45
timer_scale = 5

[voice]
voice = "am_michael"

[terminal]
workdir = "/tmp/agb-demo-with"
setup = "setup-agb.sh"
teardown = "teardown.sh"
init = "source $REEL_WORK/env; cd $REEL_WORK/app"
font_size = 52
open_hold = 0.6

[[step]]
type = "cd ../app-fix"
focus = "full"
say = "With agb, every worktree shares one warm slot."
hold = 0.3

[[step]]
type = "agb xcodebuild build -scheme App -destination 'generic/platform=iOS Simulator' 2>&1 | tee ../log"
wait = "agb: ok"
timeout = 120
timer = "agb"
focus = "full"
say = "Seconds, and a five-line report."
hold = 1.5
