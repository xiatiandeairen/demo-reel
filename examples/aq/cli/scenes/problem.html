<!doctype html>
<!-- Scene 1 of the aq walkthrough: three agents crowd one Mac, and two of them grab the same phone.
     Rendered frame by frame by reel (record_animation.py): every animation here is plain CSS, timed
     from page load, 6 s in all. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b0d14;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; }
  .bd { position: absolute; inset: -20%; filter: blur(80px); opacity: .9; background:
    radial-gradient(40% 50% at 18% 22%, #1596b8 0%, transparent 70%),
    radial-gradient(45% 55% at 85% 30%, #1f3b8f 0%, transparent 72%),
    radial-gradient(55% 60% at 60% 95%, #1596b8aa 0%, transparent 70%); }
  /* every animation holds its first frame before it starts and its last after (fill: both) */

  /* The Mac */
  .mac { position: absolute; left: 640px; top: 250px; width: 640px; }
  .screen { position: relative; height: 400px; border-radius: 26px; background: #11141d;
    border: 14px solid #252a36; box-sizing: border-box; overflow: hidden; }
  .base { height: 26px; margin: 0 -50px; border-radius: 0 0 26px 26px; background: #2e3442; }
  .hot { animation: shake .3s 2.75s 2 linear both; }
  .label { position: absolute; left: 0; right: 0; text-align: center; color: #c9cfdc; font-size: 30px; font-weight: 600; }

  /* Builds piling into the Mac */
  .chip { position: absolute; left: 70px; width: 470px; height: 78px; border-radius: 16px; color: #fff;
    font-size: 30px; font-weight: 700; display: flex; align-items: center; padding-left: 26px; box-sizing: border-box;
    animation-name: drop; animation-duration: .55s; animation-fill-mode: both;
    animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
  .c1 { top: 250px; background: #1596b8; animation-delay: 1.2s; }
  .c2 { top: 150px; background: #e0a030; animation-delay: 1.5s; }
  .c3 { top: 50px;  background: #8f6bff; animation-delay: 1.8s; }

  /* CPU meter */
  .cpu { position: absolute; left: 640px; top: 760px; width: 640px; }
  .track { height: 34px; border-radius: 17px; background: #232838; overflow: hidden; }
  .fill { height: 100%; border-radius: 17px; animation: cpu 1.9s 1.2s linear both; }
  .cpu .label { position: static; text-align: left; margin-bottom: 12px; }

  /* Agents */
  .agent { position: absolute; left: 230px; animation: enter .8s cubic-bezier(.2, .8, .2, 1) both; }
  .agent .dot { width: 120px; height: 120px; border-radius: 60px; color: #fff; font-size: 56px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 40px rgba(0, 0, 0, .35); }
  .a { top: 300px; animation-delay: 0s; }
  .b { top: 470px; animation-delay: .15s; }
  .c { top: 640px; animation-delay: .3s; }
  .a .dot { background: #1596b8; animation: dash-a .9s 3.4s cubic-bezier(.2, .8, .2, 1) both; }
  .b .dot { background: #e0a030; animation: dash-b .9s 3.4s cubic-bezier(.2, .8, .2, 1) both; }
  .c .dot { background: #8f6bff; }

  /* The phone they both grab */
  .phone { position: absolute; left: 1480px; top: 300px; width: 230px; height: 470px; border-radius: 40px;
    border: 12px solid #252a36; background: #11141d; box-sizing: border-box; overflow: hidden;
    animation: shake .12s 4.3s 5 linear both; }
  .flash { position: absolute; inset: 0; animation: fight .7s 4.3s steps(1) both; }
  .x { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #ff5a5a;
    font-size: 190px; font-weight: 800; animation: appear .3s 5.0s both; }
  .ring { position: absolute; left: 1595px; top: 535px; width: 200px; height: 200px; margin: -100px 0 0 -100px;
    border-radius: 50%; border: 10px solid #ff5a5a; animation: burst .8s 4.3s ease-out both; }

  @keyframes enter { from { transform: translateX(-420px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes drop { from { transform: translate(-560px, 120px) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes cpu { 0% { width: 18%; background: #4ade80; } 55% { background: #f5b942; } 100% { width: 100%; background: #ff5a5a; } }
  @keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @keyframes dash-a { 0% { transform: none; } 50% { transform: translate(560px, -200px); } 100% { transform: translate(1080px, 60px); } }
  @keyframes dash-b { 0% { transform: none; } 50% { transform: translate(560px, 360px); } 100% { transform: translate(1080px, 120px); } }
  @keyframes fight { 0% { background: transparent; } 1% { background: #1596b8; } 20% { background: #e0a030; } 40% { background: #1596b8; }
    60% { background: #e0a030; } 80% { background: #1596b8; } 100% { background: #3a1d24; } }
  @keyframes appear { from { opacity: 0; transform: scale(1.6); } to { opacity: 1; transform: none; } }
  @keyframes burst { 0% { opacity: 0; } 1% { transform: scale(.4); opacity: 1; } 100% { transform: scale(2.4); opacity: 0; } }
</style>
<div class="bd"></div>

<div class="mac hot">
  <div class="screen">
    <div class="chip c1">build · agent A</div>
    <div class="chip c2">build · agent B</div>
    <div class="chip c3">build · agent C</div>
  </div>
  <div class="base"></div>
</div>
<div class="cpu"><div class="label">CPU</div><div class="track"><div class="fill"></div></div></div>

<div class="phone"><div class="flash"></div><div class="x">✕</div></div>
<div class="ring"></div>

<div class="agent a"><div class="dot">A</div></div>
<div class="agent b"><div class="dot">B</div></div>
<div class="agent c"><div class="dot">C</div></div>
