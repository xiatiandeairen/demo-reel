# The aq demo, as a demo-reel spec. Recorded from the aq installed on PATH.
# setup.sh, build.sh and test.sh come from agent-quay/docs/demo: build.sh and test.sh stand in for
# heavy builds (4 CPU cores each); every aq call is real.
title = "aq"
subtitle = "A local queue and device lender for parallel AI agents"
url = "github.com/xiatiandeairen/agent-quay"
kind = "terminal"
accent = ["#1f3b8f", "#1596b8"]

[voice]
voice = "am_michael"

# One idea per film: the main film is the build queue (steps 1-6); simulators get their own clip.
[film]
from = 1
to = 6

[terminal]
workdir = "/tmp/aq-demo"
setup = "setup.sh"
teardown = "teardown.sh"
init = "source $REEL_WORK/env; cd $REEL_WORK/app"

# Grid, row by row: A | C over B | dashboard.
[[pane]]
name = "agent A"
[[pane]]
name = "agent C"
[[pane]]
name = "agent B"
[[pane]]
name = "aq status --top"
run = "aq status --top"
noisy = true

[[step]]
pane = "agent A"
type = "aq run -- ./build.sh"
say = "Agent A starts a build."
hold = 0.5

[[step]]
pane = "agent B"
type = "aq run -- ./build.sh"
say = "B asks for the same one. aq runs it once."
hold = 0.5

[[step]]
pane = "agent C"
type = "aq run -- ./test.sh"
say = "C starts the tests."
hold = 0.3

[[step]]
focus = "aq status --top"
wait = "queued 1"
say = "One heavy slot, so they wait."
hold = 2.5

[[step]]
focus = "agent B"
wait = "reused"
timeout = 40
say = "A and B get the same result."
hold = 2.0

[[step]]
focus = "full"
wait = '"ok"[\s\S]*"ok"[\s\S]*"ok"'
timeout = 40
say = "Then the tests run."
hold = 1.0

[[step]]
pane = "agent A"
type = "clear; aq hold ios-sim"
focus = "agent A"
hold = 0.3
say = "Each agent borrows a fresh simulator."

[[step]]
pane = "agent C"
type = "clear; aq hold ios-sim"
focus = ["agent A", "agent C"]
wait = '"held"[\s\S]*"held"'
timeout = 240
hold = 2.5
say = "Nobody shares a device."

# Feature clips, cut from the same recording (steps are numbered from 1).
[[clip]]
name = "one-build"
from = 1
to = 2

[[clip]]
name = "heavy-slot"
from = 3
to = 4

[[clip]]
name = "fresh-simulators"
from = 7
to = 8
