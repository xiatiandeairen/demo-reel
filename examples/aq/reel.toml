# The aq demo, as a demo-reel spec. Recorded from the aq installed on PATH.
# setup.sh, build.sh and test.sh come from agent-quay/docs/demo: build.sh and test.sh stand in for
# heavy builds (4 CPU cores each); every aq call is real.
title = "aq"
subtitle = "A local queue and device lender for parallel AI agents"
url = "github.com/xiatiandeairen/agent-quay"
kind = "terminal"
accent = ["#1f3b8f", "#1596b8"]

[terminal]
workdir = "/tmp/aq-demo"
setup = "setup.sh"
teardown = "teardown.sh"
init = "source $REEL_WORK/env; cd $REEL_WORK/app"

# Grid, row by row: A | C over B | dashboard.
[[pane]]
name = "agent A"
[[pane]]
name = "agent C"
[[pane]]
name = "agent B"
[[pane]]
name = "aq status --top"
run = "aq status --top"
noisy = true

[[step]]
pane = "agent A"
type = "aq run -- ./build.sh"
caption = "Agent A starts a build"
hold = 0.5

[[step]]
pane = "agent B"
type = "aq run -- ./build.sh"
caption = "Agent B starts the same build: aq runs it once"
hold = 0.5

[[step]]
pane = "agent C"
type = "aq run -- ./test.sh"
caption = "Agent C starts the tests"
hold = 0.3

[[step]]
focus = "aq status --top"
wait = "queued 1"
caption = "Only one heavy slot: the tests wait their turn"
hold = 2.5

[[step]]
focus = "agent B"
wait = "reused"
timeout = 40
caption = "Both agents get the same result"
hold = 2.0

[[step]]
focus = "full"
wait = '"ok"[\s\S]*"ok"[\s\S]*"ok"'
timeout = 40
caption = "Then the tests run"
hold = 1.0

[[step]]
pane = "agent A"
type = "clear; aq hold ios-sim"
focus = "agent A"
hold = 0.3
caption = "Each agent borrows its own fresh simulator"

[[step]]
pane = "agent C"
type = "clear; aq hold ios-sim"
focus = ["agent A", "agent C"]
wait = '"held"[\s\S]*"held"'
timeout = 240
hold = 2.5
caption = "Each agent borrows its own fresh simulator"
