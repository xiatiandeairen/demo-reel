# Scene 2: the same three agents without aq. build.sh is a stand-in for a heavy build (see setup.sh);
# sim-open (from setup-sims.sh) runs `xcrun simctl openurl <simulator> <agent's page>`, and here every
# agent uses the one simulator borrowed before recording.
title = "aq without"
kind = "terminal"
max_seconds = 45  # a scene of film.toml, which holds the film to 90 s

[voice]
voice = "am_michael"

[terminal]
workdir = "/tmp/aq-demo-without"
setup = "setup-shared.sh"
teardown = "teardown.sh"
open_hold = 0.6  # a later scene of the film: the crossfade already shows the layout
init = "source $REEL_WORK/env; cd $REEL_WORK/app"
layout = "even-vertical"
font_size = 52

[[pane]]
name = "agent A"
[[pane]]
name = "agent B"
[[pane]]
name = "agent C"

[[device]]
name = "the only simulator"
find = "cat $REEL_WORK/sim"

[[step]]
pane = "agent A"
type = "./build.sh"
focus = "full"
say = "Every agent builds alone."
hold = 0.2
[[step]]
pane = "agent B"
type = "./build.sh"
focus = "full"
hold = 0.2
[[step]]
pane = "agent C"
type = "./build.sh"
focus = "full"
hold = 0.5
[[step]]
pane = "agent A"
type = "sim-open A"
focus = "full"
wait = "Agent A's page is up"
timeout = 30
say = "And they fight over one simulator."
hold = 2.5
[[step]]
pane = "agent B"
type = "sim-open B"
focus = "full"
wait = "Agent B's page is up"
timeout = 30
hold = 3.0
[[step]]
focus = "full"
wait = 'succeeded[\s\S]*succeeded[\s\S]*succeeded'
timeout = 40
hold = 0.5
