# Scene 4: each agent borrows its own simulator with aq. sim-open (from setup-sims.sh) runs
# `xcrun simctl openurl <simulator> <agent's page>` and waits until it is on screen; agent A's is the first
# simulator held, B's the second. sim-find (the devices' find) gets Safari ready on each once it is held.
title = "aq borrow"
kind = "terminal"
max_seconds = 45  # a scene of film.toml, which holds the film to 90 s

[voice]
voice = "am_michael"

[terminal]
workdir = "/tmp/aq-demo-borrow"
setup = "setup-sims.sh"
teardown = "teardown.sh"
open_hold = 0.6  # a later scene of the film: the crossfade already shows the layout
init = "source $REEL_WORK/env; cd $REEL_WORK/app"
layout = "even-vertical"
font_size = 52

[[pane]]
name = "agent A"
[[pane]]
name = "agent B"

[[device]]
name = "agent A's simulator"
find = "source $REEL_WORK/env; sim-find 1"
[[device]]
name = "agent B's simulator"
find = "source $REEL_WORK/env; sim-find 2"

[[step]]
pane = "agent A"
type = "aq hold ios-sim"
focus = "full"
wait = '"held"'
timeout = 240
say = "Each agent borrows its own simulator."
hold = 0.5
[[step]]
pane = "agent A"
type = "sim-open A"
focus = "full"
wait = "Agent A's page is up"
timeout = 120
hold = 2.5
[[step]]
pane = "agent B"
type = "aq hold ios-sim"
focus = "full"
wait = '"held"[\s\S]*"held"'
timeout = 240
hold = 0.5
[[step]]
pane = "agent B"
type = "sim-open B"
focus = "full"
wait = "Agent B's page is up"
timeout = 120
say = "Nobody steps on anyone."
hold = 3.5
