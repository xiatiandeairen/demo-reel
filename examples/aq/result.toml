# Scene 5: what the two runs above measured. build.sh appends "<start> <end>" to runs.log on every
# real run, and each scene keeps that log in its state (keep_files), so these figures are counted from
# the recordings, never typed in, and the card can be drawn again after /tmp is gone.
title = "aq result"
kind = "card"

[card]
seconds = 4
lines = ["Builds run: {runs_without} → {runs_with}", "Build time: {secs_without} s → {secs_with} s"]

[card.values]
runs_without = "wc -l < {files:without-aq.toml}/runs.log | tr -d ' '"
runs_with = "wc -l < {files:with-aq.toml}/runs.log | tr -d ' '"
secs_without = "awk '{ s += $2 - $1 } END { print s }' {files:without-aq.toml}/runs.log"
secs_with = "awk '{ s += $2 - $1 } END { print s }' {files:with-aq.toml}/runs.log"
