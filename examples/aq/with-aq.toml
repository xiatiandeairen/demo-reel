# Scene 3: the same agents with aq: one build for A and B, tests wait for the single heavy slot.
# build.sh and test.sh are stand-ins for heavy builds (see setup.sh); every aq call is real.
title = "aq with"
kind = "terminal"
max_seconds = 45  # a scene of film.toml, which holds the film to 90 s

[voice]
voice = "am_michael"

[terminal]
workdir = "/tmp/aq-demo-with"
setup = "setup.sh"
teardown = "teardown.sh"
open_hold = 0.6  # a later scene of the film: the crossfade already shows the layout
keep_files = ["runs.log"]  # read by the results card as {files:with-aq.toml}/runs.log
init = "source $REEL_WORK/env; cd $REEL_WORK/app"

[[pane]]
name = "agent A"
[[pane]]
name = "agent C"
[[pane]]
name = "agent B"
[[pane]]
name = "aq status --top"
run = "aq status --top"
noisy = true

[[step]]
pane = "agent A"
type = "aq run -- ./build.sh"
hold = 0.5
[[step]]
pane = "agent B"
type = "aq run -- ./build.sh"
say = "With aq, the same build runs once."
hold = 0.5
[[step]]
pane = "agent C"
type = "aq run -- ./test.sh"
hold = 0.3
[[step]]
focus = "aq status --top"
wait = "queued 1"
say = "Heavy work waits its turn."
hold = 2.0
[[step]]
focus = "agent B"
wait = "reused"
timeout = 40
hold = 1.5
[[step]]
focus = "full"
wait = '"ok"[\s\S]*"ok"[\s\S]*"ok"'
timeout = 40
hold = 1.0
