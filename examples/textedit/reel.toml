# Stand-in Mac demo (case A8): the system's TextEdit. Needs an awake, unlocked display.
title = "TextEdit"
subtitle = "A Mac window, recorded on its own"
kind = "mac"
accent = ["#3a3f4b", "#6b7a8f"]

[mac]
app = "TextEdit"
max_seconds = 20
prepare = ["cmd+n"]

[[step]]
type = ["textfield", "Recorded with demo-reel."]
caption = "Type into it"
hold = 1.5
