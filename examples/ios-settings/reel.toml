# Stand-in iOS demo: the simulator's own Settings app (LiveTranslate has no UI yet).
title = "Settings"
subtitle = "An iOS demo recorded on a borrowed simulator"
kind = "ios"
accent = ["#2b2d42", "#4a6fa5"]

[ios]
app = "Settings"

[[step]]
press = 'text="General"'
say = "Open General."
hold = 1.2

[[step]]
press = 'text="About"'
say = "Then About."
hold = 1.5

[[step]]
back = true
say = "And back."
hold = 1.2
