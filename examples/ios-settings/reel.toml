# Stand-in iOS demo: the simulator's own Settings app (LiveTranslate has no UI yet).
title = "Settings"
subtitle = "An iOS demo recorded on a borrowed simulator"
kind = "ios"
accent = ["#2b2d42", "#4a6fa5"]

[ios]
app = "Settings"

[[step]]
press = 'text="General"'
caption = "Open General"
hold = 1.2

[[step]]
press = 'text="About"'
caption = "Then About"
hold = 1.5

[[step]]
back = true
caption = "And back"
hold = 1.2
