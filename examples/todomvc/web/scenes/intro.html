<!doctype html>
<!-- Intro scene for the TodoMVC film: three to-dos tick themselves off. Plain CSS, 3 s. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f4f1ea;
    font-family: -apple-system, "Helvetica Neue", sans-serif; }
  .list { position: absolute; left: 660px; top: 300px; width: 600px; }
  .item { display: flex; align-items: center; gap: 28px; height: 120px; font-size: 64px; font-weight: 700; color: #222; }
  .box { width: 60px; height: 60px; border-radius: 30px; border: 5px solid #b83f45; box-sizing: border-box; position: relative; }
  .box::after { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: #b83f45;
    animation: tick .3s ease-out both; }
  .item:nth-child(1) .box::after { animation-delay: 1.2s; } .item:nth-child(2) .box::after { animation-delay: 1.6s; }
  .item:nth-child(3) .box::after { animation-delay: 2.0s; }
  @keyframes tick { from { transform: scale(0); } to { transform: scale(1); } }
</style>
<div class="list"><div class="item"><div class="box"></div>Write the demo</div>
<div class="item"><div class="box"></div>Record it</div><div class="item"><div class="box"></div>Ship it</div></div>
